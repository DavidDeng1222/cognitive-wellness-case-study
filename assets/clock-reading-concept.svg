<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1400" role="img" aria-labelledby="title desc">
  <title id="title">Neutral accessible clock-reading game concept</title>
  <desc id="desc">An original portfolio illustration with a large analog clock and four high-contrast answer buttons.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#071512"/><stop offset="1" stop-color="#0f2821"/></linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8f4e8"/><stop offset="1" stop-color="#ece3cf"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="20" stdDeviation="26" flood-color="#000" flood-opacity=".28"/></filter>
  </defs>
  <rect width="900" height="1400" rx="54" fill="url(#bg)"/><circle cx="812" cy="112" r="180" fill="#39d9aa" opacity=".08"/><circle cx="76" cy="1280" r="220" fill="#f5b54c" opacity=".08"/>
  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <text x="70" y="85" fill="#80efcd" font-size="21" font-weight="700" letter-spacing="4">ACCESSIBLE INTERACTION STUDY</text><text x="70" y="145" fill="#fff" font-size="50" font-weight="750">Clock Sense</text><text x="70" y="183" fill="#adc5bd" font-size="22">Neutral interface concept · offline first</text>
    <rect x="688" y="108" width="142" height="52" rx="26" fill="#15392f" stroke="#2f725e"/><circle cx="720" cy="134" r="7" fill="#53e1b5"/><text x="740" y="142" fill="#d9fff2" font-size="18" font-weight="650">LOCAL</text>
    <g filter="url(#shadow)"><rect x="48" y="232" width="804" height="1040" rx="42" fill="url(#card)"/></g><text x="94" y="300" fill="#7b6d54" font-size="18" font-weight="700" letter-spacing="2">ROUND 04 / 08</text><text x="94" y="353" fill="#16241f" font-size="37" font-weight="760">What time does the clock show?</text><rect x="676" y="282" width="126" height="44" rx="22" fill="#d7ecdf"/><text x="739" y="311" text-anchor="middle" fill="#1d624e" font-size="17" font-weight="700">COMFORT</text>
    <g transform="translate(450 610)"><circle r="205" fill="#fffdf8" stroke="#d6c9ae" stroke-width="8"/><circle r="174" fill="none" stroke="#efe8d9" stroke-width="2"/><g stroke="#31584b" stroke-width="7" stroke-linecap="round"><line y1="-180" y2="-160"/><line y1="-180" y2="-160" transform="rotate(30)"/><line y1="-180" y2="-160" transform="rotate(60)"/><line y1="-180" y2="-160" transform="rotate(90)"/><line y1="-180" y2="-160" transform="rotate(120)"/><line y1="-180" y2="-160" transform="rotate(150)"/><line y1="-180" y2="-160" transform="rotate(180)"/><line y1="-180" y2="-160" transform="rotate(210)"/><line y1="-180" y2="-160" transform="rotate(240)"/><line y1="-180" y2="-160" transform="rotate(270)"/><line y1="-180" y2="-160" transform="rotate(300)"/><line y1="-180" y2="-160" transform="rotate(330)"/></g><g fill="#6e806f" font-size="24" font-weight="700" text-anchor="middle"><text y="-125">12</text><text x="132" y="8">3</text><text y="145">6</text><text x="-132" y="8">9</text></g><line x1="0" y1="4" x2="-86" y2="-86" stroke="#182b25" stroke-width="18" stroke-linecap="round"/><line x1="0" y1="4" x2="122" y2="-72" stroke="#1f745c" stroke-width="12" stroke-linecap="round"/><circle r="17" fill="#f2a93b" stroke="#fffdf8" stroke-width="6"/></g>
    <text x="94" y="867" fill="#6c604c" font-size="19">Choose one answer. Take your time.</text><g font-size="31" font-weight="760" text-anchor="middle"><rect x="94" y="905" width="336" height="112" rx="24" fill="#e7f3ed" stroke="#2f8067" stroke-width="3"/><text x="262" y="976" fill="#1d624e">10:10</text><rect x="470" y="905" width="336" height="112" rx="24" fill="#fffdf8" stroke="#d7cbb4" stroke-width="3"/><text x="638" y="976" fill="#20332c">10:20</text><rect x="94" y="1043" width="336" height="112" rx="24" fill="#fffdf8" stroke="#d7cbb4" stroke-width="3"/><text x="262" y="1114" fill="#20332c">09:10</text><rect x="470" y="1043" width="336" height="112" rx="24" fill="#fffdf8" stroke="#d7cbb4" stroke-width="3"/><text x="638" y="1114" fill="#20332c">11:50</text></g>
    <g fill="#6e6552" font-size="17" font-weight="650"><text x="100" y="1223">LARGE TYPE</text><text x="288" y="1223">GENTLE PACE</text><text x="493" y="1223">NO ACCOUNT</text><text x="678" y="1223">OFFLINE</text></g><text x="450" y="1340" text-anchor="middle" fill="#95afa6" font-size="17" letter-spacing="1">PORTFOLIO VISUALIZATION · NO CLIENT ASSETS</text>
  </g>
</svg>
